<!DOCTYPE html><html lang="ko"><head>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Noto+Serif+KR:wght@600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined {
      display: inline-block;
      width: 1em;
      height: 1em;
      line-height: 1 !important;
      box-sizing: content-box;
      overflow: hidden;
      white-space: nowrap;
      direction: ltr;
      vertical-align: middle;
    }
  </style>
</head>
<body class="bg-surface-variant text-on-surface font-body min-h-[1024px] antialiased flex flex-col" data-stitch-vh="min-h-[1024px]===min-h-screen">

  <!-- 1. Global Two-Tier Header (Shell Parity) -->
  <header class="bg-surface border-b border-outline shadow-[0_0_0_1px_rgba(31,23,25,0.03),0_1px_2px_rgba(31,23,25,0.04)] sticky top-0 z-30">
    <div class="max-w-shell-max mx-auto px-space-5 lg:px-0">
      <div class="flex flex-wrap items-center justify-between gap-space-4 pt-space-5 pb-space-3">
        <a href="../home/Home.html" class="flex items-baseline gap-space-2 focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary">
          <span data-design-text-token="headline-lg" class="font-headline text-headline-lg text-primary tracking-tight">MuDeal</span>
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-muted hidden sm:inline">뮤지컬 할인 비교</span>
        </a>

        <form action="../search/Search.html" class="flex-1 max-w-md min-w-60">
          <label for="global-search" class="sr-only">작품명, 뮤지컬 배우, 공연장 검색</label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined text-muted absolute left-space-3 pointer-events-none" aria-hidden="true">search</span>
            <input id="global-search" type="search" placeholder="작품명 · 뮤지컬 배우 · 공연장 검색" class="w-full h-10 pl-space-8 pr-space-4 rounded-sm bg-surface-variant border border-outline text-body-md text-on-surface placeholder:text-hint focus:bg-surface focus:border-secondary focus:ring-0 transition-colors duration-state-change ease-state-change">
          </div>
        </form>

        <div class="flex items-center gap-space-3">
          <a href="#" aria-current="page" class="inline-flex items-center gap-space-1 h-10 px-space-3 rounded-sm bg-primary border border-primary text-on-primary transition-colors duration-state-change">
            <span class="material-symbols-outlined text-lg" aria-hidden="true">edit_note</span>
            <span data-design-text-token="label-md" class="font-label text-label-md">할인 제보</span>
          </a>
          <a href="../my/MyPage.html" class="inline-flex items-center gap-space-2 h-10 px-space-3 rounded-sm bg-rose-mist text-primary hover:bg-surface-sunken transition-colors duration-state-change">
            <span class="material-symbols-outlined text-lg" aria-hidden="true">person</span>
            <span data-design-text-token="label-md" class="font-label text-label-md">MY</span>
            <span data-design-text-token="label-sm" class="px-space-1 py-0 rounded-xs bg-primary text-on-primary font-label text-label-sm tabular-nums">3</span>
          </a>
        </div>
      </div>

      <nav aria-label="메인 내비게이션" class="flex items-center justify-between gap-space-4 overflow-x-auto">
        <div class="flex items-center gap-space-6">
          <a href="../home/Home.html" class="h-12 inline-flex items-center border-b-4 border-transparent text-on-surface-variant hover:text-on-surface whitespace-nowrap transition-colors duration-state-change">
            <span data-design-text-token="title-md" class="font-title text-title-md">홈</span>
          </a>
          <a href="../home/Home.html#ticket-open" class="h-12 inline-flex items-center border-b-4 border-transparent text-on-surface-variant hover:text-on-surface whitespace-nowrap transition-colors duration-state-change">
            <span data-design-text-token="title-md" class="font-title text-title-md">티켓오픈 임박</span>
          </a>
          <a href="../home/Home.html#community-deals" class="h-12 inline-flex items-center border-b-4 border-transparent text-on-surface-variant hover:text-on-surface whitespace-nowrap transition-colors duration-state-change">
            <span data-design-text-token="title-md" class="font-title text-title-md">제보해주신 딜</span>
          </a>
          <a href="../home/Home.html#spotlight" class="h-12 inline-flex items-center border-b-4 border-transparent text-on-surface-variant hover:text-on-surface whitespace-nowrap transition-colors duration-state-change">
            <span data-design-text-token="title-md" class="font-title text-title-md">로터리·특가</span>
          </a>
          <a href="../home/Home.html#all-deals" class="h-12 inline-flex items-center border-b-4 border-transparent text-on-surface-variant hover:text-on-surface whitespace-nowrap transition-colors duration-state-change">
            <span data-design-text-token="title-md" class="font-title text-title-md">싱어롱·특전</span>
          </a>
        </div>
        <span data-design-text-token="body-sm" class="font-body text-body-sm text-muted hidden md:inline whitespace-nowrap tabular-nums">11.25 (수) KST 기준</span>
      </nav>
    </div>
  </header>

  <main class="flex-1 w-full max-w-shell-max mx-auto px-space-5 lg:px-0 py-space-8">
    <section class="max-w-2xl mx-auto bg-surface rounded-lg border border-outline p-space-6 flex flex-col gap-space-6">
      <div class="border-b border-outline pb-space-4">
        <h1 data-design-text-token="headline-lg" class="font-headline text-headline-lg text-on-surface">할인 · 이벤트 제보하기</h1>
      </div>

      <form id="report-form" class="flex flex-col gap-space-5">
        <!-- 1. 제보 유형 -->
        <div class="flex flex-col gap-space-2">
          <span data-design-text-token="label-md" class="font-label text-label-md text-on-surface">제보 유형</span>
          <div class="grid grid-cols-3 gap-space-3">
            <button type="button" class="report-type-btn h-10 rounded-sm bg-rose-mist border border-secondary text-primary font-label text-label-md transition-colors duration-state-change" data-type="deal">할인 딜</button>
            <button type="button" class="report-type-btn h-10 rounded-sm bg-surface border border-outline text-on-surface-variant hover:bg-surface-variant font-label text-label-md transition-colors duration-state-change" data-type="event">현장 이벤트·특전</button>
            <button type="button" class="report-type-btn h-10 rounded-sm bg-surface border border-outline text-on-surface-variant hover:bg-surface-variant font-label text-label-md transition-colors duration-state-change" data-type="open">티켓오픈 소식</button>
          </div>
        </div>

        <!-- 2. 원문 예매처 링크 (필수) -->
        <div class="flex flex-col gap-space-2">
          <label for="source-url" data-design-text-token="label-md" class="font-label text-label-md text-on-surface">원문 예매처 링크 (필수)</label>
          <input id="source-url" type="url" required placeholder="https://ticket.yes24.com/Perf/..." value="https://ticket.yes24.com/Perf/51204" class="w-full h-10 px-space-3 rounded-sm bg-surface-variant border border-outline text-body-md text-on-surface placeholder:text-hint focus:bg-surface focus:border-secondary focus:ring-0">
        </div>

        <!-- 3. 표시 닉네임 & 증빙 이미지 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-space-4">
          <div class="flex flex-col gap-space-2">
            <label for="nickname-input" data-design-text-token="label-md" class="font-label text-label-md text-on-surface">표시 닉네임</label>
            <input id="nickname-input" type="text" value="대학로산책" class="w-full h-10 px-space-3 rounded-sm bg-surface-variant border border-outline text-body-md text-on-surface focus:bg-surface focus:border-secondary focus:ring-0">
          </div>

          <div class="flex flex-col gap-space-2">
            <span data-design-text-token="label-md" class="font-label text-label-md text-on-surface">증빙 이미지 (선택)</span>
            <label class="h-10 px-space-3 rounded-sm bg-surface border border-outline-strong text-on-surface-variant hover:bg-surface-variant cursor-pointer inline-flex items-center justify-between transition-colors duration-state-change">
              <span data-design-text-token="body-sm" class="font-body text-body-sm">이미지 파일 선택...</span>
              <span class="material-symbols-outlined text-lg text-primary" aria-hidden="true">upload_file</span>
              <input type="file" accept="image/*" class="sr-only">
            </label>
          </div>
        </div>

        <!-- 4. Submit Row -->
        <div class="flex flex-wrap items-center justify-between gap-space-3 pt-space-4 border-t border-outline">
          <button type="button" id="draft-btn" data-component-id="button-secondary" data-component-type="button" data-component-variant="secondary" class="w-32 h-10 px-space-4 rounded-sm bg-surface border border-outline text-on-surface-variant hover:bg-surface-variant font-label text-label-md inline-flex items-center justify-center transition-colors duration-state-change">
            <span>임시 저장</span>
          </button>

          <button type="submit" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="w-48 h-12 px-space-5 rounded-sm bg-secondary text-on-secondary hover:bg-secondary-hover font-label text-label-lg inline-flex items-center justify-center transition-colors duration-state-change">
            <span>제보 등록하기</span>
          </button>
        </div>
      </form>
    </section>
  </main>

  <!-- 2. Ultra-Slim 1-Line Mini Footer -->
  <footer class="bg-surface-variant border-t border-outline py-space-5 mt-space-8">
    <div class="max-w-shell-max mx-auto px-space-5 lg:px-0 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-space-2">
      <p data-design-text-token="body-sm" class="font-body text-body-sm text-muted">
        MuDeal · 외부 예매처 할인·이벤트 비교 서비스 (자체 결제·발권 미제공 · KOPIS 공공데이터 활용)
      </p>
      <span data-design-text-token="body-sm" class="font-body text-body-sm text-muted tabular-nums">© 2026 MuDeal</span>
    </div>
  </footer>

  <script>
    (function () {
      document.querySelectorAll('.report-type-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.report-type-btn').forEach((b) => {
            b.className = 'report-type-btn h-10 rounded-sm bg-surface border border-outline text-on-surface-variant hover:bg-surface-variant font-label text-label-md transition-colors duration-state-change';
          });
          btn.className = 'report-type-btn h-10 rounded-sm bg-rose-mist border border-secondary text-primary font-label text-label-md transition-colors duration-state-change';
        });
      });

      const draftBtn = document.getElementById('draft-btn');
      draftBtn.addEventListener('click', () => {
        const span = draftBtn.querySelector('span');
        span.textContent = '임시 저장됨 ✓';
        draftBtn.className = 'w-32 h-10 px-space-4 rounded-sm bg-rose-mist border border-secondary text-primary font-label text-label-md inline-flex items-center justify-center transition-colors duration-state-change';
      });
    })();
  </script>


</body></html>
