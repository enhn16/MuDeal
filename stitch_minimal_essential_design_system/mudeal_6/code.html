<body class="bg-surface-variant text-on-surface font-body min-h-[1024px] antialiased flex flex-col" data-stitch-vh="min-h-[1024px]===min-h-screen">

  <!-- Minimal Auth Header (Back to Home) -->
  <header class="max-w-shell-max w-full mx-auto px-space-5 lg:px-0 py-space-6 flex items-center justify-between">
    <a href="../home/Home.html" class="flex items-baseline gap-space-2">

      <span data-design-text-token="label-sm" class="font-label text-label-sm text-muted">뮤지컬 할인 비교</span>
    </a>
    <a href="../home/Home.html" class="inline-flex items-center gap-space-1 text-on-surface-variant hover:text-primary font-label text-label-md">
      <span class="material-symbols-outlined text-base" aria-hidden="true">arrow_back</span>
      <span>홈으로 돌아가기</span>
    </a>
  </header>

  <!-- Centered Auth Card -->
  <main class="flex-1 flex items-center justify-center px-space-5 py-space-8">
    <section class="w-full max-w-md bg-surface rounded-lg border border-outline p-space-7 flex flex-col gap-space-6 shadow-[0_0_0_1px_rgba(31,23,25,0.03),0_2px_8px_rgba(31,23,25,0.05)]">
      <div class="text-center">
        <h1 data-design-text-token="headline-lg" class="font-headline text-headline-lg text-on-surface text-balance">간편 로그인으로 시작하기</h1>
      </div>

      <!-- Social Login Buttons -->
      <div class="flex flex-col gap-space-3">
        <a href="../my/MyPage.html" class="w-full h-12 px-space-4 rounded-sm bg-curtain-noir text-on-curtain-noir hover:bg-mulberry font-label text-label-lg inline-flex items-center justify-center gap-space-2 transition-colors duration-state-change">
          <span class="material-symbols-outlined text-lg text-gold-wash" aria-hidden="true">chat_bubble</span>
          <span>카카오로 3초 만에 시작하기</span>
        </a>

        <a href="../my/MyPage.html" class="w-full h-12 px-space-4 rounded-sm bg-surface border border-outline-strong text-on-surface hover:bg-surface-variant font-label text-label-lg inline-flex items-center justify-center gap-space-2 transition-colors duration-state-change">
          <span class="material-symbols-outlined text-lg text-primary" aria-hidden="true">account_circle</span>
          <span>Google 계정으로 계속하기</span>
        </a>
      </div>

        로그인 시 이용약관 및 개인정보처리방침에 동의합니다.
      </p>
